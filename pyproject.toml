[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-vm-optimizer"
version = "0.1.0"
description = "Cloud workload forecasting and dual-objective VM allocation college demo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "xgboost>=2.0,<4",
  "streamlit>=1.39,<2",
  "boto3>=1.34,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

